[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "doom-demo"
version = "0.1.0"
description = "Qwen3.5 vision plays ViZDoom through minisgl's shared-cache AsyncLLM frontend"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "torch",
    "transformers",
    "numpy",
    "vizdoom>=1.2.4",
    "gymnasium",
    "pillow",
]

# minisgl (the parent repo) and async-thoughts (scripts/async_thoughts) are
# imported but not pulled from an index. Install both in the same environment
# first: `uv pip install -e . -e scripts/async_thoughts` from the repo root.

[project.scripts]
doom-demo = "doom_demo.__main__:main"

[tool.setuptools.packages.find]
include = ["doom_demo*"]
