[project]
name = "speleo-sglang-environment"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "sglang==0.5.17",
    "numpy==2.3.5",
    "pillow>=10",
    "gymnasium==0.29.1",
    "pygame==2.6.1",
]

[tool.uv]
package = false
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
build-constraint-dependencies = ["numpy==2.3.5", "setuptools==78.1.0", "pybind11==2.13.1"]

[tool.uv.config-settings-package]
craftium = { editable_mode = "compat" }
